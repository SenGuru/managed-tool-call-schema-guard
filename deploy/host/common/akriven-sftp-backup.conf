Match Group akriven-sftp-backup
    ChrootDirectory /var/lib/akriven-backups
    ForceCommand internal-sftp -d /incoming
    AuthorizedKeysFile /etc/ssh/akriven-authorized-keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTunnel no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
