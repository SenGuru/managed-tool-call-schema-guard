services:
  schema-guard-anchor-receiver:
    build:
      context: ..
      target: anchor-receiver
    image: schema-guard-anchor-receiver:0.2.0
    restart: unless-stopped
    user: '10002:10002'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      SCHEMA_GUARD_ANCHOR_DATABASE: /anchor-data/anchor.db
      SCHEMA_GUARD_ANCHOR_SIGNING_SECRET: ${SCHEMA_GUARD_ANCHOR_SIGNING_SECRET}
      SCHEMA_GUARD_ANCHOR_READ_TOKEN: ${SCHEMA_GUARD_ANCHOR_READ_TOKEN}
      SCHEMA_GUARD_ANCHOR_CHAIN_SECRET: ${SCHEMA_GUARD_ANCHOR_CHAIN_SECRET}
    ports:
      - '127.0.0.1:8790:8790'
    volumes:
      - schema-guard-anchor-data:/anchor-data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m

volumes:
  schema-guard-anchor-data:
