services:
  schema-guard-anchor-wireguard-edge:
    image: schema-guard-caddy-edge:2.11.4-go1.26.5-linux-amd64
    restart: unless-stopped
    user: '65532:65532'
    network_mode: host
    volumes:
      - ./Caddyfile.anchor-wireguard:/etc/caddy/Caddyfile:ro
      - ${SCHEMA_GUARD_ANCHOR_TLS_DIRECTORY}:/run/anchor-tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /config:size=16m,uid=65532,gid=65532,mode=0700
      - /data:size=16m,uid=65532,gid=65532,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 128m
