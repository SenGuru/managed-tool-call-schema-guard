services:
  schema-guard-managed:
    build:
      context: ..
      target: managed
    image: schema-guard-managed:0.2.0
    restart: unless-stopped
    user: '10001:10001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8788
      SCHEMA_GUARD_DATABASE: /data/managed.db
      SCHEMA_GUARD_PUBLIC_MODE: 'true'
      SCHEMA_GUARD_INSTANCE_COUNT: '1'
      SCHEMA_GUARD_SHARED_ACTION_DATABASE_URL: ${SCHEMA_GUARD_SHARED_ACTION_DATABASE_URL:-}
      SCHEMA_GUARD_SHARED_CONTROL_DATABASE_URL: ${SCHEMA_GUARD_SHARED_CONTROL_DATABASE_URL:-}
      SCHEMA_GUARD_TRUST_PROXY: 'true'
      SCHEMA_GUARD_RATE_LIMIT_PER_MINUTE: '600'
      SCHEMA_GUARD_REQUEST_TIMEOUT_MS: '5000'
      SCHEMA_GUARD_ACTION_RECONCILIATION_MIN_AGE_SECONDS: '300'
      SCHEMA_GUARD_ALERT_WEBHOOK_POLL_INTERVAL_MS: '5000'
      SCHEMA_GUARD_ALERT_WEBHOOK_REQUEST_TIMEOUT_MS: '5000'
      SCHEMA_GUARD_ALERT_WEBHOOK_MAX_ATTEMPTS: '8'
      SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_URL: ${SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_URL}
      SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_SIGNING_SECRET: ${SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_SIGNING_SECRET}
      SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_POLL_INTERVAL_MS: '5000'
      SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_REQUEST_TIMEOUT_MS: '5000'
      SCHEMA_GUARD_ACTION_CHECKPOINT_ANCHOR_MAX_ATTEMPTS: '8'
      SCHEMA_GUARD_EXTERNAL_URL: ${SCHEMA_GUARD_EXTERNAL_URL}
      SCHEMA_GUARD_MASTER_SECRET: ${SCHEMA_GUARD_MASTER_SECRET}
    ports:
      - '127.0.0.1:8788:8788'
    volumes:
      - schema-guard-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m

volumes:
  schema-guard-data:
