name: Nightly conformance

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-conformance:
    name: Offline deterministic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run deterministic corpus and compatibility gate
        run: npm run conformance:check -- --output conformance-report.json
      - name: Preserve machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: error
          retention-days: 30
