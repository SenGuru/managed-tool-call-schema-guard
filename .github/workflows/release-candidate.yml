name: Release candidate certification

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  certify:
    name: Non-skippable release certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_USER: schema_guard
          POSTGRES_PASSWORD: schema_guard_release
          POSTGRES_DB: schema_guard_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_guard -d schema_guard_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SCHEMA_GUARD_TEST_POSTGRES_URL: postgresql://schema_guard:schema_guard_release@127.0.0.1:5432/schema_guard_release
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SCHEMA_GUARD_OPENAI_MODEL: ${{ vars.SCHEMA_GUARD_OPENAI_MODEL }}
      SCHEMA_GUARD_ANTHROPIC_MODEL: ${{ vars.SCHEMA_GUARD_ANTHROPIC_MODEL }}
      SCHEMA_GUARD_GEMINI_MODEL: ${{ vars.SCHEMA_GUARD_GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.72.0
          cache: true
      - run: npm ci
      - name: Run non-skippable release-candidate certification
        run: npm run audit:release-candidate -- --output release-candidate-report.json
      - name: Preserve certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-report
          path: release-candidate-report.json
          if-no-files-found: error
          retention-days: 90
