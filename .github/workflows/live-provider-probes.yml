name: Live provider probes

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: live-provider-probes
  cancel-in-progress: false

jobs:
  live-provider-probes:
    name: Live configured-provider probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SCHEMA_GUARD_OPENAI_MODEL: ${{ vars.SCHEMA_GUARD_OPENAI_MODEL }}
      SCHEMA_GUARD_ANTHROPIC_MODEL: ${{ vars.SCHEMA_GUARD_ANTHROPIC_MODEL }}
      SCHEMA_GUARD_GEMINI_MODEL: ${{ vars.SCHEMA_GUARD_GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe exact configured provider models
        run: npm run probe:live -- --provider all --trials 3 --output live-provider-report.json
      - name: Preserve privacy-safe probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-provider-report
          path: live-provider-report.json
          if-no-files-found: warn
          retention-days: 30
